name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-progress run when a newer commit is pushed to the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A throwaway Postgres for the integration tests. It exists only for
    # this job, so the tests can wipe it freely.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: equilibria_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/equilibria_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/equilibria_test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # npm ci installs exactly what package-lock.json lists; postinstall
      # generates the Prisma client.
      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # Applies migrations to the service database, then runs unit and
      # integration tests.
      - run: npm test

      - run: npm run build
